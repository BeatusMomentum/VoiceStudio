# Commit identity gate — fails a PR when any of its commits carries a blocked
# author/committer/trailer identity (hashed personal emails, placeholder and
# hostname-style tool identities, AI agents) or when a commit message or the
# PR description carries AI agent attribution. The blocked emails are stored only as
# SHA-256 digests in scripts/blocked_identity_hashes.txt; the job output names
# the commit and the kind of match, never the address.
#
# Only commits new to the PR (origin/<base>..HEAD) are checked, so existing
# history does not fail the gate.

name: commit-identity

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: commit-identity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  identities:
    name: Commit identities
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check PR commit identities
        env:
          BASE_REF: ${{ github.base_ref }}
        # Run the base branch's checker and lists, so a pull request cannot
        # edit the gate it is judged by. Its commits are only read as data.
        run: |
          policy="$RUNNER_TEMP/policy"
          mkdir -p "$policy"
          files="scripts/check_commit_identities.py scripts/blocked_identity_hashes.txt .github/scripts/agent_identities.py"
          if git cat-file -e "origin/${BASE_REF}:scripts/check_commit_identities.py" 2>/dev/null; then
            git archive "origin/${BASE_REF}" $files | tar -x -C "$policy"
          else
            # Only the pull request that introduces the gate reaches this branch.
            tar -c $files | tar -x -C "$policy"
          fi
          python3 "$policy/scripts/check_commit_identities.py" \
            --hash-file "$policy/scripts/blocked_identity_hashes.txt" \
            --range "origin/${BASE_REF}..HEAD" --event "$GITHUB_EVENT_PATH"
