version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current (pins are
  # enforced by tests/test_actions_pinned.py). One grouped PR per week.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
